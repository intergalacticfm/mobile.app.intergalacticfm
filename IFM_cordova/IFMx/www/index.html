<!doctype html>
<html lang="en">

<head>
    <title>Intergalactic FM</title>
    <link rel="stylesheet" type="text/css" href="css/index.css">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
</head>

<body>
    <div class="header">
        <!-- Header -->
        <h1><img src="img/logo.svg" alt="IFM logo" style="max-height: 2em"></h1>
    </div>
    <div id="container" class="container">
        <!-- Channel list -->
        <div class="channels">
            <button id="cbsChannelButton" class="channel">
                <table>
                    <tr>
                        <td>
                            <img class="channelIcon" src="img/cbs.png" />
                        </td>
                        <td>
                            CYBERNETIC BROADCASTING SYSTEM
                        </td>
                    </tr>
                </table>
            </button>
            <p></p>
            <button id="dfChannelButton" class="channel">
                <table>
                    <tr>
                        <td>
                            <img class="channelIcon" src="img/df.png" />
                        </td>
                        <td>
                            DISCO FETISH
                        </td>
                    </tr>
                </table>
            </button>
            <p></p>
            <button id="tdmChannelButton" class="channel">
                <table>
                    <tr>
                        <td>
                            <img class="channelIcon" src="img/tdm.png" />
                        </td>
                        <td>
                            THE DREAM MACHINE
                        </td>
                    </tr>
                </table>
            </button>
            <!-- 
            <p></p>
            <button id="mtvChannelButton" class="channel">
                <table>
                    <tr>
                        <td>
                            <img class="channelIcon" src="img/mtv.png" />
                        </td>
                        <td>
                            MurderCapital TV
                        </td>
                    </tr>
                </table>
            </button>
            -->
        </div>

        <div id="messageBox">
        </div>

        <div class="links">
            <button id="websiteRedirect" class="channel">
                <table>
                    <tr>
                        <td>
                            @
                        </td>
                        <td>
                            WEBSITE
                        </td>
                    </tr>
                </table>
            </button>
            <button id="donateRedirect" class="channel">
                <table>
                    <tr>
                        <td>
                            $
                        </td>
                        <td>
                            DONATE
                        </td>
                    </tr>
                </table>
            </button>
            <button id="archiveRedirect" class="channel">
                <table>
                    <tr>
                        <td>
                            [-]
                        </td>
                        <td>
                            ARCHIVE
                        </td>
                    </tr>
                </table>
            </button>
        </div>
    </div>
    <!-- Now Playing -->
    <div id="trackInfoModal" class="modal">
        <button id="stopButton" class="close">X</button>
        <div id="track-meta">
            <h5 id="nowPlaying"> </h5>
        </div>
        <div id="nowPlayingCover"></div>
        <h6 id="nowPlayingExt"></h6>
    </div>
    <script src="js/howler.core.js"></script>
    <script src="js/index.js"></script>
    <script src="js/radio.js"></script>
    <!-- 
    <script src="js/lockscreen.js"></script>
    -->
</body>

</html>
