<!doctype html>
<html lang="en">

<head>
    <title>Intergalactic FM</title>
    <link rel="stylesheet" type="text/css" href="css/index.css">
    <link rel="icon" type="image/x-icon" href="https://intergalactic.fm/themes/custom/ifm/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
</head>

<body>
    <div class="container">
        <div class="header">
            <!-- Header -->
            <h1><img src="img/logo.svg" alt="IFM logo" style="max-height: 2em"></h1>
        </div>
        <!-- Channel list -->
        <div class="channels">
            <button id="cbsChannelButton" class="channel">
                <table>
                    <tr>
                        <td>
                            <img class="channelIcon" src="img/cbs.png" />
                        </td>
                        <td>
                            Cybernetic Broadcasting System
                        </td>
                    </tr>
                </table>
            </button>
            <p></p>
            <button id="dfChannelButton" class="channel">
                <table>
                    <tr>
                        <td>
                            <img class="channelIcon" src="img/df.png" />
                        </td>
                        <td>
                            Disco Fetish
                        </td>
                    </tr>
                </table>
            </button>
            <p></p>
            <button id="tdmChannelButton" class="channel">
                <table>
                    <tr>
                        <td>
                            <img class="channelIcon" src="img/tdm.png" />
                        </td>
                        <td>
                            The Dream Machine
                        </td>
                    </tr>
                </table>
            </button>
            <p></p>
            <button id="mtvChannelButton" class="channel">
                <table>
                    <tr>
                        <td>
                            <img class="channelIcon" src="img/mtv.png" />
                        </td>
                        <td>
                            MurderCapital TV
                        </td>
                    </tr>
                </table>
            </button>
        </div>

        <div id="messageBox">
        </div>

        <div id="links">
            <button id="websiteRedirect">GO TO WEBSITE</button>
            <button id="donateRedirect">DONATE TO IFM</button>
        </div>

        <!-- Now Playing -->
        <div id="trackInfoModal" class="modal">
            <button id="stopButton" class="close">x</button>
            <div id="track-meta">
                <h5 id="nowPlaying"> </h5>
            </div>
            <br>
            <div id="nowPlayingCover"></div>
            <h6 id="nowPlayingExt"></h6>

        </div>
    </div>
    <script src="js/howler.core.js"></script>
    <script src="js/index.js"></script>
    <script src="js/radio.js"></script>
</body>

</html>
